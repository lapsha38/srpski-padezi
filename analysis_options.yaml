# Строгий набор правил: very_good_analysis плюс усиленный анализ типов.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Публичная документация обязательна только для библиотек, а это приложение.
    public_member_api_docs: ignore
    # В файлах с грамматическими данными длинные объяснения намеренно
    # разбиты на соседние строковые литералы внутри списков.
    no_adjacent_strings_in_list: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**

linter:
  rules:
    prefer_single_quotes: true
    require_trailing_commas: true
