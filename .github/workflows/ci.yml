name: CI

on:
  push:
    branches: [main]
    # Changes to docs alone do not need a build.
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
  release:
    types: [published]

permissions:
  contents: read
  checks: write

jobs:
  check:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    env:
      GIST_SECRET: ${{ secrets.GIST_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Tests
        run: |
          mkdir -p test-results
          flutter test --machine > test-results/raw.log

      # `flutter test --machine` prints pub output and a couple of non-object
      # lines around the JSON stream, so the report keeps only JSON objects.
      - name: Prepare test report
        if: always()
        run: grep '^{' test-results/raw.log > test-results/flutter.json

      # Publishes a check run with the list of tests. `flutter-json` is the
      # native format of `flutter test --machine`, so no converter is needed.
      - name: Publish test results
        id: test-count
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Results
          path: test-results/flutter.json
          reporter: flutter-json
          fail-on-error: true
          only-summary: false

      # The badge in README reads this gist. Counts of failed and skipped
      # tests are appended only when they are not zero, so a clean run shows
      # just "42 passed".
      - name: Update test badge
        if: always() && github.event_name == 'push' && env.GIST_SECRET != ''
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.BADGE_GIST_ID }}
          filename: srpski-padezi-tests.json
          label: tests
          message: "${{ steps.test-count.outputs.passed || '0' }} passed${{ steps.test-count.outputs.failed != '0' && steps.test-count.outputs.failed != '' && format(' · {0} failed', steps.test-count.outputs.failed) || '' }}${{ steps.test-count.outputs.skipped != '0' && steps.test-count.outputs.skipped != '' && format(' · {0} skipped', steps.test-count.outputs.skipped) || '' }}"
          color: ${{ steps.test-count.outputs.conclusion == 'success' && 'brightgreen' || 'red' }}

  android:
    name: Android APK
    needs: check
    # Only a release needs the APK: on a push there is nowhere to publish it.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # The release build is signed with the debug key: that is enough to
      # install the APK on a phone, but not to publish it on Google Play.
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v7
        with:
          name: srpski-padezi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # The APK is attached to the release, so it can be downloaded straight
      # to a phone.
      - name: Attach APK to the release
        uses: softprops/action-gh-release@v3
        with:
          files: build/app/outputs/flutter-apk/app-release.apk

  pages:
    name: Publish web version to GitHub Pages
    needs: check
    # Deploys from main: the site always matches the latest commit.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Pages serves the site from a subdirectory, so the base href has to
      # match the repository name.
      - name: Build web version
        run: flutter build web --release --base-href /srpski-padezi/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v5
